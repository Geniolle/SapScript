<section class="kpi-grid">
  <!-- Card 1: Roles Concluídas -->
  <div class="kpi-card" style="cursor: default;">
    <div class="kpi-icon-wrapper green">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="kpi-data">
      <div class="kpi-title" id="focused-kpi-roles-title">Roles concluídas</div>
      <div class="kpi-value">
        <span id="focused-kpi-roles">0/0</span>
        <span class="kpi-sub" id="focused-kpi-roles-rate">100%</span>
      </div>
    </div>
  </div>

  <!-- Card 2: Ações -->
  <div class="kpi-card" style="cursor: default;">
    <div class="kpi-icon-wrapper purple">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    </div>
    <div class="kpi-data">
      <div class="kpi-title">Ações</div>
      <div class="kpi-value">
        <span id="focused-kpi-actions">0</span>
        <span class="kpi-sub">Total executadas</span>
      </div>
    </div>
  </div>

  <!-- Card 3: Tempo total -->
  <div class="kpi-card" style="cursor: default;">
    <div class="kpi-icon-wrapper blue">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    <div class="kpi-data">
      <div class="kpi-title">Tempo total</div>
      <div class="kpi-value">
        <span id="focused-kpi-duration">00:00:00</span>
        <span class="kpi-sub">Duração da execução</span>
      </div>
    </div>
  </div>

  <!-- Card 4: Erros -->
  <div class="kpi-card" style="cursor: default;">
    <div class="kpi-icon-wrapper red">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <div class="kpi-data">
      <div class="kpi-title">Erros</div>
      <div class="kpi-value">
        <span id="focused-kpi-errors">0</span>
        <span class="kpi-sub" id="focused-kpi-errors-sub">Sem erros</span>
      </div>
    </div>
  </div>
</section>
